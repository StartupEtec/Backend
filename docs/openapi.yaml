        is_primary:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreatePaymentMethodRequest:
      type: object
      required:
        - card_number
        - cvv
        - exp_month
        - exp_year
        - cardholder_name
      properties:
        card_number:
          type: string
          pattern: ^\d{13,19}$
          example: '4000123456789010'
          description: Número de la tarjeta (13-19 dígitos)
        cvv:
          type: string
          pattern: ^\d{3,4}$
          example: '123'
          description: Código de seguridad (3-4 dígitos). No se almacena.
        exp_month:
          type: integer
          minimum: 1
          maximum: 12
          example: 12
          description: Mes de expiración (1-12)
        exp_year:
          type: integer
          example: 2030
          description: Año de expiración (cuatro dígitos)
        cardholder_name:
          type: string
          example: Juan Pérez
          description: Nombre del titular de la tarjeta
        is_primary:
          type: boolean
          default: false
          description: Define si es el método de pago por defecto
    CreatePaymentMethodResponse:
      type: object
      properties:
        message:
          type: string
          example: Método de pago agregado correctamente
        payment_method:
          $ref: '#/components/schemas/PaymentMethodResponse'
    ListPaymentMethodsResponse:
      type: object
      properties:
        payment_methods:
          type: array
          items:
            $ref: '#/components/schemas/PaymentMethodResponse'
    UpdatePaymentMethodRequest:
      type: object
      properties:
        exp_month:
          type: integer
          minimum: 1
          maximum: 12
          example: 12
          description: Nuevo mes de expiración
        exp_year:
          type: integer
          example: 2031
          description: Nuevo año de expiración
        cardholder_name:
          type: string
          example: Juan Pérez Modificado
          description: Nuevo nombre del titular
        is_primary:
          type: boolean
          example: true
          description: Marcar como método de pago por defecto
      description: Todos los campos son opcionales en PATCH
    UpdatePaymentMethodResponse:
      type: object
      properties:
        message:
          type: string
          example: Método de pago actualizado correctamente
        payment_method:
          $ref: '#/components/schemas/PaymentMethodResponse'
    DeletePaymentMethodResponse:
      type: object
      properties:
        message:
          type: string
          example: Método de pago eliminado correctamente
    PaymentMethodNotFoundError:
      type: object
      properties:
        error:
          type: string
          example: PAYMENT_METHOD_NOT_FOUND
        message:
          type: string
          example: Método de pago no encontrado
        statusCode:
          type: integer
          example: 404
        timestamp:
          type: string
          format: date-time
    PaymentMethodLimitError:
      type: object
      properties:
        error:
          type: string
          example: PAYMENT_METHOD_LIMIT_REACHED
        message:
          type: string
          example: Máximo de 10 métodos de pago alcanzado
        statusCode:
          type: integer
          example: 409
        timestamp:
          type: string
          format: date-time
    PaymentMethodHasTransactionsError:
      type: object
      properties:
        error:
          type: string
          example: PAYMENT_METHOD_HAS_TRANSACTIONS
        message:
          type: string
          example: 'No se puede eliminar: existen transacciones pendientes asociadas'
        statusCode:
          type: integer
          example: 409
        timestamp:
          type: string
          format: date-time
    NotificationResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: a1b2c3d4-...
        user_id:
          type: string
          format: uuid
          example: b2c3d4e5-...
        type:
          type: string
          example: ORDER_STATUS_CHANGE
          enum:
            - SERVICE_REQUEST
            - QUOTE_RECEIVED
            - QUOTE_ACCEPTED
            - SERVICE_COMPLETED
            - NEW_MESSAGE
            - ORDER_STATUS_CHANGE
        title:
          type: string
          example: Estado de orden actualizado
        body:
          type: string
          example: Tu orden ha sido aceptada por el trabajador
        status:
          type: string
          example: SENT
          enum:
            - PENDING
            - SENT
            - FAILED
            - READ
        created_at:
          type: string
          format: date-time
    ListNotificationsResponse:
      type: object
      properties:
        notifications:
          type: array
          items:
            $ref: '#/components/schemas/NotificationResponse'
        count:
          type: integer
          example: 25
        limit:
          type: integer
          example: 20
        offset:
          type: integer
          example: 0
    UnreadCountResponse:
      type: object
      properties:
        unread_count:
          type: integer
          example: 5
    NotificationPreferencesResponse:
      type: object
      properties:
        push_enabled:
          type: boolean
          example: true
        email_enabled:
          type: boolean
          example: true
        sms_enabled:
          type: boolean
          example: false
        dnd_enabled:
          type: boolean
          example: false
        dnd_start:
          type: string
          example: '22:00'
          nullable: true
        dnd_end:
          type: string
          example: '08:00'
          nullable: true
    UpdateNotificationPreferencesRequest:
      type: object
      properties:
        push_enabled:
          type: boolean
        email_enabled:
          type: boolean
        sms_enabled:
          type: boolean
        dnd_enabled:
          type: boolean
        dnd_start:
          type: string
          pattern: ^[0-2][0-9]:[0-5][0-9]$
          example: '22:00'
        dnd_end:
          type: string
          pattern: ^[0-2][0-9]:[0-5][0-9]$
          example: '08:00'
      description: Todos los campos son opcionales
    SendTestNotificationRequest:
      type: object
      properties:
        type:
          type: string
          enum:
            - SERVICE_REQUEST
            - QUOTE_RECEIVED
            - QUOTE_ACCEPTED
            - SERVICE_COMPLETED
            - NEW_MESSAGE
            - ORDER_STATUS_CHANGE
          default: ORDER_STATUS_CHANGE
        channels:
          type: array
          items:
            type: string
            enum:
              - push
              - email
              - sms
paths:
  /workers/{id}/availability:
    post:
      summary: Crear un rango de disponibilidad
      description: >-
        Crea un rango horario de disponibilidad semanal para el perfil de trabajador. Solo el propietario del perfil
        puede hacerlo. Máximo 2 rangos por día de la semana.
      tags:
        - Disponibilidad del Trabajador
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: UUID del perfil de trabajador
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - day_of_week
                - start_time
                - end_time
              properties:
                day_of_week:
                  type: integer
                  minimum: 0
                  maximum: 6
                  example: 1
                  description: Día de la semana, 0 (Domingo) a 6 (Sábado)
                start_time:
                  type: string
                  pattern: ^([01]\d|2[0-3]):[0-5]\d$
                  example: '09:00'
                  description: Hora de inicio del rango en formato 24h (HH:mm)
                end_time:
                  type: string
                  pattern: ^([01]\d|2[0-3]):[0-5]\d$
                  example: '13:00'
                  description: Hora de fin del rango en formato 24h (HH:mm). Debe ser posterior a start_time
      responses:
        '201':
          description: Rango de disponibilidad creado correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Disponibilidad creada correctamente
                  availability:
                    $ref: '#/components/schemas/WorkerAvailability'
        '400':
          description: Error de validación (formato, rango invertido o DAY_OF_WEEK fuera de 0-6)
        '401':
          description: No autenticado
        '404':
          description: Perfil de trabajador no encontrado o no autorizado
        '409':
          description: Se alcanzó el máximo de 2 rangos para el día
        '500':
          description: Error interno del servidor
    get:
      summary: Listar disponibilidad de un trabajador
      description: >-
        Devuelve todos los rangos de disponibilidad semanal del perfil de trabajador ordenados por día y hora de inicio.
        Solo el propietario puede consultarlos.
      tags:
        - Disponibilidad del Trabajador
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: UUID del perfil de trabajador
      responses:
        '200':
          description: Lista de rangos de disponibilidad devuelta exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  availability:
                    type: array
                    items:
                      $ref: '#/components/schemas/WorkerAvailability'
                  count:
                    type: integer
        '401':
          description: No autenticado
        '404':
          description: Perfil de trabajador no encontrado o no autorizado
        '500':
          description: Error interno del servidor
  /availability/{id}:
    patch:
      summary: Actualizar un rango de disponibilidad
      description: >-
        Actualiza el día o el rango horario de una disponibilidad existente. Solo el propietario del perfil de
        trabajador asociado puede hacerlo.
      tags:
        - Disponibilidad del Trabajador
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: UUID del rango de disponibilidad
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                day_of_week:
                  type: integer
                  minimum: 0
                  maximum: 6
                  example: 2
                  description: Día de la semana, 0 (Domingo) a 6 (Sábado)
                start_time:
                  type: string
                  pattern: ^([01]\d|2[0-3]):[0-5]\d$
                  example: '10:00'
                end_time:
                  type: string
                  pattern: ^([01]\d|2[0-3]):[0-5]\d$
                  example: '15:00'
      responses:
        '200':
          description: Rango de disponibilidad actualizado correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Disponibilidad actualizada correctamente
                  availability:
                    $ref: '#/components/schemas/WorkerAvailability'
        '400':
          description: Error de validación o rango horario invertido
        '401':
          description: No autenticado
        '404':
          description: Disponibilidad no encontrada o no autorizado
        '409':
          description: Se alcanzó el máximo de 2 rangos para el nuevo día
        '500':
          description: Error interno del servidor
    delete:
      summary: Eliminar un rango de disponibilidad
      description: >-
        Elimina un rango de disponibilidad existente. Solo el propietario del perfil de trabajador asociado puede
        hacerlo.
      tags:
        - Disponibilidad del Trabajador
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: UUID del rango de disponibilidad
      responses:
        '200':
          description: Rango de disponibilidad eliminado correctamente
        '401':
          description: No autenticado
        '404':
          description: Disponibilidad no encontrada o no autorizado
        '500':
          description: Error interno del servidor
  /workers/{id}/certifications:
    post:
      summary: Subir un documento de certificación
      description: >-
        Permite al proveedor subir un documento (PDF/imagen) de validación para su perfil (BACKGROUND_CHECK,
        ID_VERIFICATION o PROFESSIONAL_LICENSE). Máximo 10MB.
      tags:
        - Certificaciones
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: UUID del perfil de proveedor
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - document
                - document_type
              properties:
                document:
                  type: string
                  format: binary
                  description: Archivo digitalizado (PDF, JPG, PNG) max 10MB
                document_type:
                  type: string
                  enum:
                    - BACKGROUND_CHECK
                    - ID_VERIFICATION
                    - PROFESSIONAL_LICENSE
                  example: ID_VERIFICATION
      responses:
        '201':
          description: Documento subido y registrado correctamente en estado PENDING
        '400':
          description: Error de validación o formato/tamaño de archivo no permitido
        '401':
          description: No autenticado
        '403':
          description: No autorizado
        '404':
          description: Perfil de trabajador no encontrado
        '500':
          description: Error interno del servidor
    get:
      summary: Listar las certificaciones de un proveedor
      description: Devuelve todos los documentos de certificación subidos por el proveedor asociado.
      tags:
        - Certificaciones
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: UUID del perfil de proveedor
      responses:
        '200':
          description: Lista de certificaciones devuelta exitosamente
        '401':
          description: No autenticado
        '403':
          description: No autorizado
        '404':
          description: Perfil de trabajador no encontrado
        '500':
          description: Error interno del servidor
  /certifications/{id}:
    get:
      summary: Obtener el detalle de una certificación
      description: >-
        Retorna la información de una certificación específica. Acceso exclusivo al proveedor propietario y al
        administrador.
      tags:
        - Certificaciones
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: UUID de la certificación
      responses:
        '200':
          description: Detalle de certificación devuelto exitosamente
        '401':
          description: No autenticado
        '403':
          description: No autorizado
        '404':
          description: Certificación no encontrada
        '500':
          description: Error interno del servidor
    patch:
      summary: Reenviar un documento de certificación rechazado
      description: >-
        Permite subir un nuevo archivo para una certificación que fue previamente REJECTED, cambiando su estado a
        PENDING.
      tags:
        - Certificaciones
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: UUID de la certificación
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - document
              properties:
                document:
                  type: string
                  format: binary
                  description: Nuevo archivo digitalizado
      responses:
        '200':
          description: Documento reenviado y estado restablecido a PENDING
        '400':
          description: Error de validación o la certificación no se encuentra rechazada
        '401':
          description: No autenticado
        '403':
          description: No autorizado
        '404':
          description: Certificación no encontrada
        '500':
          description: Error interno del servidor
  /certifications/{id}/status:
    patch:
      summary: Actualizar estado de verificación de una certificación (Admin)
      description: >-
        Permite aprobar (APPROVED) o rechazar (REJECTED) una certificación de proveedor. Requiere motivo de rechazo en
        caso de REJECTED.
      tags:
        - Certificaciones
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: UUID de la certificación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - verification_status
              properties:
                verification_status:
                  type: string
                  enum:
                    - PENDING
                    - APPROVED
                    - REJECTED
                  example: APPROVED
                rejected_reason:
                  type: string
                  minLength: 5
                  example: Documento de identidad poco legible o borroso
                  description: Requerido solo si status es REJECTED
      responses:
        '200':
          description: Estado de certificación actualizado correctamente
        '400':
          description: Error de validación (ej. falta motivo en rechazo)
        '401':
          description: No autenticado
        '403':
          description: No autorizado
        '404':
          description: Certificación no encontrada
        '500':
          description: Error interno del servidor
  /disputes:
    post:
      summary: Abrir una disputa
      description: >-
        Permite al cliente o trabajador de una orden abrir una disputa. La orden debe estar en estado COMPLETED o
        CANCELLED y no debe existir otra disputa abierta para la misma orden.
      tags:
        - Disputas
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - order_id
                - reason
              properties:
                order_id:
                  type: string
                  format: uuid
                  description: UUID de la orden en estado COMPLETED o CANCELLED
                  example: c3d4e5f6-...
                reason:
                  type: string
                  minLength: 10
                  maxLength: 2000
                  description: Motivo de la disputa
                  example: El servicio no se completó de acuerdo a lo acordado
                evidence_url:
                  type: string
                  format: uri
                  nullable: true
                  description: URL opcional de foto o documento de evidencia
      responses:
        '201':
          description: Disputa creada correctamente en estado OPEN
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Disputa creada correctamente
                  dispute:
                    $ref: '#/components/schemas/Dispute'
        '400':
          description: Error de validación o faltan participantes de la orden
        '401':
          description: No autenticado
        '403':
          description: El usuario no es participante de la orden
        '404':
          description: Orden no encontrada
        '409':
          description: La orden no está en COMPLETED/CANCELLED o ya existe una disputa
        '500':
          description: Error interno del servidor
    get:
      summary: Listar disputas
      description: >-
        Devuelve las disputas. Los usuarios ven únicamente las disputas donde participan (como cliente, trabajador o
        aperturante); los administradores ven todas. Soporta paginación.
      tags:
        - Disputas
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Cantidad máxima de resultados
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Desplazamiento para paginación
      responses:
        '200':
          description: Lista de disputas devuelta exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  disputes:
                    type: array
                    items:
                      $ref: '#/components/schemas/Dispute'
                  count:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
        '400':
          description: Parámetros de consulta inválidos
        '401':
          description: No autenticado
        '500':
          description: Error interno del servidor
  /disputes/{id}:
    patch:
      summary: Resolver o cerrar una disputa
      description: >-
        Acceso exclusivo de administrador. Cambia el estado de una disputa OPEN a RESOLVED o CLOSED. Si es RESOLVED, se
        requiere el campo `winner` para ejecutar la resolución financiera; a favor del cliente reembolsa los fondos
        (desde escrow o debitando del trabajador si ya fueron liberados); a favor del trabajador libera los fondos
        retenidos en escrow.
      tags:
        - Disputas
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: UUID de la disputa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
                - resolution_notes
              properties:
                status:
                  type: string
                  enum:
                    - RESOLVED
                    - CLOSED
                  description: RESOLVED ejecuta la resolución financiera, CLOSED solo cierra la disputa
                resolution_notes:
                  type: string
                  minLength: 10
                  maxLength: 2000
                  description: Notas que explican la resolución
                winner:
                  type: string
                  enum:
                    - client
                    - worker
                  nullable: true
                  description: Requerido cuando status es RESOLVED. Indica a favor de quién se resuelve
      responses:
        '200':
          description: Disputa resuelta/cerrada correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Disputa resuelta/cerrada correctamente
                  dispute:
                    $ref: '#/components/schemas/Dispute'
        '400':
          description: Error de validación
        '401':
          description: No autenticado
        '403':
          description: Solo administradores pueden resolver disputas
        '404':
          description: Disputa u orden asociada no encontrada
        '409':
          description: La disputa no está en estado OPEN
        '500':
          description: Error interno del servidor
        '502':
          description: No se pudo reembolsar a la tarjeta del cliente
  /health:
    get:
      summary: Diagnóstico básico de salud del sistema
      description: Retorna el estado global simplificado de la API, base de datos y caché.
      tags:
        - Health & Monitoreo
      responses:
        '200':
          description: El sistema está operativo o parcialmente degradado
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: UP
                  timestamp:
                    type: string
                    format: date-time
                  services:
                    type: object
                    properties:
                      api:
                        type: string
                        example: UP
                      database:
                        type: string
                        example: UP
                      cache:
                        type: string
                        example: UP
  /health/detailed:
    get:
      summary: Diagnóstico detallado del sistema y APM
      description: >-
        Retorna información profunda sobre latencias de BD/Caché, uptime del proceso y métricas agregadas del APM
        interno (errores 5xx, latencia promedio y percentil 95).
      tags:
        - Health & Monitoreo
      responses:
        '200':
          description: Diagnóstico profundo devuelto exitosamente
          content:
            application/json:
              schema:
                type: object
  /health/dashboard:
    get:
      summary: Acceso al Dashboard de Monitoreo Visual
      description: Sirve la página web interactiva con gráficas de latencia y estado de componentes en tiempo real.
      tags:
        - Health & Monitoreo
      responses:
        '200':
          description: Dashboard visual retornado correctamente
          content:
            text/html:
              schema:
                type: string
  /notifications:
    get:
      tags:
        - Notifications
      summary: Listar notificaciones del usuario
      description: Retorna las notificaciones del usuario autenticado con paginación y filtros opcionales.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
          description: Cantidad máxima de resultados por página.
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Desplazamiento para paginación.
        - in: query
          name: status
          schema:
            type: string
            enum:
              - PENDING
              - SENT
              - FAILED
              - READ
          description: Filtrar por estado de la notificación.
        - in: query
          name: type
          schema:
            type: string
            enum:
              - SERVICE_REQUEST
              - QUOTE_RECEIVED
              - QUOTE_ACCEPTED
              - SERVICE_COMPLETED
              - NEW_MESSAGE
              - ORDER_STATUS_CHANGE
          description: Filtrar por tipo de notificación.
      responses:
        '200':
          description: Lista de notificaciones.
        '401':
          description: Token de autenticación faltante o inválido.
        '500':
          description: Error interno del servidor.
  /notifications/unread-count:
    get:
      tags:
        - Notifications
      summary: Obtener conteo de notificaciones no leídas
      description: Retorna la cantidad de notificaciones que el usuario no ha leído.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Conteo de no leídas.
          content:
            application/json:
              schema:
                type: object
                properties:
                  unread_count:
                    type: integer
        '500':
          description: Error interno del servidor.
  /notifications/{id}/read:
    patch:
      tags:
        - Notifications
      summary: Marcar notificación como leída
      description: Marca una notificación específica como leída.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: ID de la notificación.
      responses:
        '200':
          description: Notificación marcada como leída.
        '404':
          description: Notificación no encontrada.
        '500':
          description: Error interno del servidor.
  /notifications/read-all:
    patch:
      tags:
        - Notifications
      summary: Marcar todas las notificaciones como leídas
      description: Marca todas las notificaciones no leídas del usuario como leídas.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Cantidad de notificaciones marcadas.
        '500':
          description: Error interno del servidor.
  /notifications/preferences:
    get:
      tags:
        - Notifications
      summary: Obtener preferencias de notificación
      description: Retorna las preferencias de notificación del usuario autenticado.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Preferencias de notificación.
        '500':
          description: Error interno del servidor.
    patch:
      tags:
        - Notifications
      summary: Actualizar preferencias de notificación
      description: Actualiza las preferencias de notificación del usuario autenticado.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                push_enabled:
                  type: boolean
                email_enabled:
                  type: boolean
                sms_enabled:
                  type: boolean
                dnd_enabled:
                  type: boolean
                dnd_start:
                  type: string
                  pattern: ^[0-2][0-9]:[0-5][0-9]$
                  example: '22:00'
                dnd_end:
                  type: string
                  pattern: ^[0-2][0-9]:[0-5][0-9]$
                  example: '08:00'
      responses:
        '200':
          description: Preferencias actualizadas.
        '400':
          description: Error de validación.
        '500':
          description: Error interno del servidor.
  /notifications/test:
    post:
      tags:
        - Notifications
      summary: Enviar notificación de prueba
      description: Envía una notificación de prueba al usuario autenticado. Solo disponible en desarrollo.
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  enum:
                    - SERVICE_REQUEST
                    - QUOTE_RECEIVED
                    - QUOTE_ACCEPTED
                    - SERVICE_COMPLETED
                    - NEW_MESSAGE
                    - ORDER_STATUS_CHANGE
                  default: ORDER_STATUS_CHANGE
                channels:
                  type: array
                  items:
                    type: string
                    enum:
                      - push
                      - email
                      - sms
      responses:
        '201':
          description: Notificación de prueba enviada.
        '403':
          description: No disponible en producción.
        '500':
          description: Error interno del servidor.
  /payments/process:
    post:
      summary: Iniciar el proceso de pago de una orden
      description: >
        Crea y confirma una intención de pago en Stripe utilizando el método de pago especificado.

        Maneja flujos tanto de confirmación directa (síncrona) como de requerimiento de acción adicional (redirigir para
        3D Secure).
      tags:
        - Pagos
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - order_id
                - payment_method_id
                - amount
              properties:
                order_id:
                  type: string
                  format: uuid
                  example: 123e4567-e89b-12d3-a456-426614174000
                  description: UUID de la orden a pagar
                payment_method_id:
                  type: string
                  format: uuid
                  example: 987f6543-e21b-32d3-b456-526614174999
                  description: UUID del método de pago guardado del usuario
                amount:
                  type: number
                  minimum: 0.01
                  example: 150
                  description: Monto total a cobrar
      responses:
        '200':
          description: Pago completado exitosamente o requiere validación 3D Secure
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - succeeded
                      - requires_action
                    example: succeeded
                  client_secret:
                    type: string
                    example: pi_123_secret_abc
                    description: Solo si status es 'requires_action'
                  next_action:
                    type: object
                    description: Datos adicionales de redirección si requiere acción
        '400':
          description: Error de validación en los campos enviados
        '401':
          description: No autenticado
        '402':
          description: Pago rechazado (tarjeta declinada)
        '403':
          description: No autorizado para pagar la orden
        '404':
          description: Orden o método de pago no encontrado
        '409':
          description: Conflicto - El pago para la orden ya ha sido iniciado o completado
        '500':
          description: Error interno al procesar el cobro
  /webhooks/payment:
    post:
      summary: Receptor de webhooks de eventos de Stripe
      description: >
        Procesa eventos asíncronos enviados por Stripe (como 'payment_intent.succeeded' o
        'payment_intent.payment_failed').

        Verifica la autenticidad del evento mediante la validación de la firma en la cabecera 'stripe-signature'.

        Si el pago tiene éxito, la transacción local se actualiza a 'ESCROWED'. Si falla, la transacción pasa a 'FAILED'
        y la orden se cancela.
      tags:
        - Pagos
      parameters:
        - in: header
          name: stripe-signature
          required: true
          schema:
            type: string
          description: Firma de verificación generada por Stripe
      responses:
        '200':
          description: Evento recibido y procesado correctamente
        '400':
          description: Firma inválida o formato incorrecto del webhook
        '500':
          description: Error interno al actualizar el estado de la transacción
  /users/{id}/payment-methods:
    post:
      summary: Agregar un método de pago
      description: >
        Crea y asocia un nuevo método de pago (tarjeta de crédito/débito) a la cuenta del usuario.

        Valida el número de tarjeta usando el algoritmo de Luhn, enmascara el número mostrando solo los últimos 4
        dígitos

        y encripta la tarjeta de forma segura usando AES-256-CBC. El CVV no se almacena en el sistema.

        El usuario puede tener un máximo de 10 métodos de pago guardados.
      tags:
        - Métodos de Pago
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: UUID del usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - card_number
                - cvv
                - exp_month
                - exp_year
                - cardholder_name
              properties:
                card_number:
                  type: string
                  pattern: ^\d{13,19}$
                  example: '4000123456789010'
                  description: Número de la tarjeta (13-19 dígitos)
                cvv:
                  type: string
                  pattern: ^\d{3,4}$
                  example: '123'
                  description: Código de seguridad (3-4 dígitos)
                exp_month:
                  type: integer
                  minimum: 1
                  maximum: 12
                  example: 12
                  description: Mes de expiración (1-12)
                exp_year:
                  type: integer
                  example: 2030
                  description: Año de expiración (cuatro dígitos)
                cardholder_name:
                  type: string
                  example: Juan Pérez
                  description: Nombre del titular de la tarjeta
                is_primary:
                  type: boolean
                  default: false
                  description: Define si es el método de pago por defecto
      responses:
        '201':
          description: Método de pago creado correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Método de pago agregado correctamente
                  payment_method:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      user_id:
                        type: string
                        format: uuid
                      card_number_masked:
                        type: string
                        example: '**** **** **** 9010'
                      card_brand:
                        type: string
                        example: Visa
                      exp_month:
                        type: integer
                        example: 12
                      exp_year:
                        type: integer
                        example: 2030
                      cardholder_name:
                        type: string
                        example: Juan Pérez
                      is_primary:
                        type: boolean
                        example: true
                      created_at:
                        type: string
                        format: date-time
                      updated_at:
                        type: string
                        format: date-time
        '400':
          description: Error de validación o límite de tarjetas excedido
        '401':
          description: No autenticado
        '403':
          description: No autorizado
        '500':
          description: Error interno del servidor
    get:
      summary: Listar los métodos de pago de un usuario
      description: >-
        Obtiene la lista de métodos de pago guardados de un usuario autenticado. Los números de tarjeta se devuelven
        enmascarados.
      tags:
        - Métodos de Pago
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: UUID del usuario
      responses:
        '200':
          description: Lista de métodos de pago devuelta con éxito
          content:
            application/json:
              schema:
                type: object
                properties:
                  payment_methods:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        user_id:
                          type: string
                          format: uuid
                        card_number_masked:
                          type: string
                          example: '**** **** **** 9010'
                        card_brand:
                          type: string
                          example: Visa
                        exp_month:
                          type: integer
                          example: 12
                        exp_year:
                          type: integer
                          example: 2030
                        cardholder_name:
                          type: string
                          example: Juan Pérez
                        is_primary:
                          type: boolean
                          example: true
                        created_at:
                          type: string
                          format: date-time
                        updated_at:
                          type: string
                          format: date-time
        '401':
          description: No autenticado
        '403':
          description: No autorizado
        '500':
          description: Error interno del servidor
  /payment-methods/{id}:
    patch:
      summary: Actualizar un método de pago
      description: Actualiza la fecha de expiración, el nombre del titular o el estado predeterminado de una tarjeta específica.
      tags:
        - Métodos de Pago
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: UUID del método de pago
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                exp_month:
                  type: integer
                  minimum: 1
                  maximum: 12
                  example: 12
                exp_year:
                  type: integer
                  example: 2031
                cardholder_name:
                  type: string
                  example: Juan Pérez Modificado
                is_primary:
                  type: boolean
                  example: true
      responses:
        '200':
          description: Método de pago actualizado correctamente
        '400':
          description: Error de validación
        '401':
          description: No autenticado
        '403':
          description: No autorizado
        '404':
          description: Método de pago no encontrado
        '500':
          description: Error interno del servidor
    delete:
      summary: Eliminar un método de pago
      description: >-
        Elimina de forma lógica o física un método de pago, siempre y cuando no existan transacciones pendientes
        asociadas al mismo.
      tags:
        - Métodos de Pago
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: UUID del método de pago
      responses:
        '200':
          description: Método de pago eliminado correctamente
        '401':
          description: No autenticado
        '403':
          description: No autorizado
        '404':
          description: Método de pago no encontrado
        '409':
          description: Conflicto - Transacciones pendientes asociadas al método de pago
        '500':
          description: Error interno del servidor
  /auth/register:
    post:
      summary: Registrar un nuevo usuario
      description: |
        Crea una cuenta nueva con email, teléfono y contraseña.
        Al finalizar, envía un código OTP de 6 dígitos por Email y SMS.
        El usuario debe verificar el OTP mediante `POST /auth/verify-otp` para activar su cuenta.
      tags:
        - Autenticación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              email: usuario@example.com
              phone: '3001234567'
              password: P@ssword123!
      responses:
        '201':
          description: Usuario creado exitosamente. OTP enviado por Email y SMS.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          description: Error de validación (email inválido, contraseña débil, etc.)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '409':
          description: El correo electrónico o teléfono ya están registrados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictError'
        '429':
          description: Demasiados intentos. Rate limit excedido (5 req/IP/15min).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
  /auth/login:
    post:
      summary: Iniciar sesión del usuario
      description: |
        Valida las credenciales del usuario. Si son correctas, genera y envía un OTP por Email/SMS
        y retorna el estado `PENDING_VERIFICATION`. El usuario debe verificar el OTP con
        `POST /auth/verify-otp` para obtener el JWT de acceso.
      tags:
        - Autenticación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              loginConEmail:
                summary: Login con email
                value:
                  email: usuario@example.com
                  password: P@ssword123!
              loginConTelefono:
                summary: Login con teléfono
                value:
                  phone: '3001234567'
                  password: P@ssword123!
      responses:
        '200':
          description: Credenciales válidas. OTP enviado. Estado PENDING_VERIFICATION.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginPendingResponse'
        '400':
          description: Error de validación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          description: Credenciales incorrectas (usuario no encontrado o contraseña inválida).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '429':
          description: Rate limit excedido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
  /auth/verify-otp:
    post:
      summary: Verificar código OTP (2FA)
      description: |
        Valida el código OTP de 6 dígitos enviado durante el registro o login.
        Si el OTP es válido y no ha expirado (10 minutos), devuelve un JWT de acceso
        y un refresh token. El OTP se invalida automáticamente tras un uso exitoso.
      tags:
        - Autenticación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOtpRequest'
            example:
              email: usuario@example.com
              otp_code: '123456'
      responses:
        '200':
          description: OTP verificado exitosamente. Devuelve JWT + RefreshToken.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: OTP inválido, incorrecto o expirado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidOtpError'
        '429':
          description: Rate limit excedido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'
  /auth/refresh-token:
    post:
      summary: Renovar JWT de acceso mediante refresh token
      description: |
        Valida el refresh token, lo revoca (rotación de token por seguridad) y emite un nuevo
        accessToken (1 hora) + nuevo refreshToken (7 días).
        El refresh token anterior queda invalidado inmediatamente tras este llamado.
      tags:
        - Autenticación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Nuevo JWT y RefreshToken (rotado) emitidos exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenResponse'
        '400':
          description: Error de validación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          description: Refresh token inválido, expirado o ya revocado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRefreshTokenError'
        '429':
          description: Rate limit excedido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
  /auth/forgot-password:
    post:
      summary: Solicitar código de recuperación de contraseña
      description: |
        Acepta email o phone y genera un código de recuperación de 6 dígitos válido por 30 minutos.
        Envía el código de forma simulada por SMS/Email (revisar logs en desarrollo).
        Protegido por rate limiting (5 req/IP/15min).
      tags:
        - Autenticación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Código de recuperación enviado exitosamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Código de recuperación enviado correctamente.
        '400':
          description: Error de validación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '404':
          description: Usuario no encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '429':
          description: Rate limit excedido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
  /auth/verify-reset-code:
    post:
      summary: Validar código de recuperación
      description: |
        Valida el código de recuperación enviado. Si es correcto, retorna un token temporal de JWT
        válido por 10 minutos. El código se limpia tras la validación.
      tags:
        - Autenticación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyResetCodeRequest'
      responses:
        '200':
          description: Código verificado correctamente. Retorna token temporal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TempTokenResponse'
        '400':
          description: Código de recuperación inválido o expirado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '429':
          description: Rate limit excedido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
  /auth/reset-password:
    post:
      summary: Restablecer contraseña con token temporal
      description: |
        Acepta el token temporal de JWT (obtenido de /auth/verify-reset-code) y la nueva contraseña.
        Verifica la firma y validez del token contra el hash de contraseña actual (permitiendo un solo uso).
        Actualiza la base de datos y audita la acción.
      tags:
        - Autenticación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Contraseña restablecida correctamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Contraseña restablecida correctamente.
        '400':
          description: Token temporal inválido/expirado o error de validación de contraseña.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '429':
          description: Rate limit excedido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
  /users/{id}:
    get:
      summary: Obtener perfil público de un usuario
