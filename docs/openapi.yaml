openapi: 3.0.0
info:
  title: Backend API — Plataforma de Trabajo Independiente On-Demand
  version: 1.0.0
  description: >-

    ## Flujo de Autenticación con Verificación en Dos Pasos (2FA/OTP)


    La API implementa un sistema de autenticación con JWT y verificación OTP de dos pasos.


    ### Flujo de Registro

    1. `POST /auth/register` — Crea el usuario y envía un OTP por Email/SMS.

    2. `POST /auth/verify-otp` — Valida el OTP. Devuelve `accessToken` + `refreshToken`.


    ### Flujo de Login

    1. `POST /auth/login` — Valida credenciales. Si son correctas, envía OTP y retorna estado `PENDING_VERIFICATION`.

    2. `POST /auth/verify-otp` — Valida el OTP. Devuelve `accessToken` + `refreshToken`.


    ### Renovación de token

    - `POST /auth/refresh-token` — Usa el `refreshToken` para obtener un nuevo `accessToken` + nuevo `refreshToken`
    (rotación de token por seguridad).


    ### Tokens

    - **accessToken**: JWT firmado, payload `{ user_id, email, current_role, iat, exp }`. Expira en **1 hora**.

    - **refreshToken**: JWT firmado, payload `{ user_id, jti, exp }`. Expira en **7 días**. Almacenado en BD para
    revocación.


    ### Rate Limiting

    Los endpoints de autenticación tienen un límite de **5 intentos por IP cada 15 minutos**.
          
servers:
  - url: http://localhost:3000/api/v1
    description: Servidor local de desarrollo
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Ingrese el accessToken obtenido de /auth/verify-otp
  schemas:
    PublicProfileResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: a1b2c3d4-...
        full_name:
          type: string
          example: Juan Pérez
        avatar_url:
          type: string
          example: https://example.com/avatar.jpg
          nullable: true
        bio:
          type: string
          example: Técnico especialista en reparaciones
          nullable: true
        average_rating:
          type: string
          example: '4.5'
          nullable: true
          description: Rating promedio del usuario
        role:
          type: string
          example: worker
          enum:
            - worker
            - client
    PrivateProfileResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
          example: usuario@example.com
        phone:
          type: string
          example: '3001234567'
        current_role:
          type: string
          example: client
        is_verified:
          type: boolean
          example: true
        verified_email:
          type: boolean
          example: false
        verified_phone:
          type: boolean
          example: false
        active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        average_rating:
          type: string
          example: '4.5'
          nullable: true
        profile:
          type: object
          properties:
            client:
              type: object
              nullable: true
              properties:
                id:
                  type: string
                  format: uuid
                full_name:
                  type: string
                avatar_url:
                  type: string
                  nullable: true
                bio:
                  type: string
                  nullable: true
            worker:
              type: object
              nullable: true
              properties:
                id:
                  type: string
                  format: uuid
                full_name:
                  type: string
                avatar_url:
                  type: string
                  nullable: true
                bio:
                  type: string
                  nullable: true
                hourly_rate:
                  type: number
                  example: 25.5
                availability_status:
                  type: string
                  example: AVAILABLE
                certification_status:
                  type: string
                  example: PENDING
    ClientProfileResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: a1b2c3d4-...
        user_id:
          type: string
          format: uuid
          example: a1b2c3d4-...
        full_name:
          type: string
          example: Juan Pérez
        avatar_url:
          type: string
          example: https://example.com/avatar.jpg
          nullable: true
        bio:
          type: string
          example: Cliente desde 2024
          nullable: true
        default_location_id:
          type: string
          format: uuid
          nullable: true
        preferences:
          type: object
          nullable: true
          example:
            notifications: true
            language: es
            theme: light
          description: Preferencias del cliente en JSON
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateClientProfileRequest:
      type: object
      required:
        - full_name
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 100
          example: Juan Pérez
          description: Nombre completo del cliente
        avatar_url:
          type: string
          example: https://example.com/avatar.jpg
          description: URL del avatar (JPG/PNG)
          nullable: true
        bio:
          type: string
          maxLength: 500
          example: Cliente desde 2024
          description: Biografía del cliente (máx. 500 caracteres)
          nullable: true
        default_location_id:
          type: string
          format: uuid
          example: a1b2c3d4-...
          description: ID de la ubicación por defecto
          nullable: true
        preferences:
          type: object
          nullable: true
          example:
            notifications: true
            language: es
            theme: light
          description: Preferencias del cliente en formato JSON
    UpdateClientProfileRequest:
      type: object
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 100
          example: Juan Pérez
          description: Nombre completo del cliente
        avatar_url:
          type: string
          example: https://example.com/avatar.jpg
          description: URL del avatar (JPG/PNG)
          nullable: true
        bio:
          type: string
          maxLength: 500
          example: Cliente desde 2024
          description: Biografía del cliente (máx. 500 caracteres)
          nullable: true
        default_location_id:
          type: string
          format: uuid
          example: a1b2c3d4-...
          description: ID de la ubicación por defecto
          nullable: true
        preferences:
          type: object
          nullable: true
          example:
            notifications: true
            language: es
            theme: light
          description: Preferencias del cliente en formato JSON
      description: Todos los campos son opcionales en PATCH
    CreateClientProfileResponse:
      type: object
      properties:
        message:
          type: string
          example: Perfil de cliente creado correctamente
        profile:
          $ref: '#/components/schemas/ClientProfileResponse'
    UpdateClientProfileResponse:
      type: object
      properties:
        message:
          type: string
          example: Perfil de cliente actualizado correctamente
        profile:
          $ref: '#/components/schemas/ClientProfileResponse'
    ClientProfileExistsError:
      type: object
      properties:
        error:
          type: string
          example: CLIENT_PROFILE_EXISTS
        message:
          type: string
          example: El perfil de cliente ya existe. Usa PATCH para actualizarlo.
        statusCode:
          type: integer
          example: 409
        timestamp:
          type: string
          format: date-time
    ClientProfileNotFoundError:
      type: object
      properties:
        error:
          type: string
          example: CLIENT_PROFILE_NOT_FOUND
        message:
          type: string
          example: Perfil de cliente no encontrado. Crea uno con POST.
        statusCode:
          type: integer
          example: 404
        timestamp:
          type: string
          format: date-time
    WorkerProfileResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: a1b2c3d4-...
        user_id:
          type: string
          format: uuid
          example: a1b2c3d4-...
        full_name:
          type: string
          example: Carlos García
        avatar_url:
          type: string
          example: https://example.com/avatar.jpg
          nullable: true
        bio:
          type: string
          example: Técnico especialista en reparaciones
          nullable: true
        category_id:
          type: string
          format: uuid
          example: b2c3d4e5-...
          nullable: true
        category_name:
          type: string
          example: Plumbing
          nullable: true
        hourly_rate:
          type: number
          example: 35.5
        availability_status:
          type: string
          example: AVAILABLE
          enum:
            - AVAILABLE
            - BUSY
            - OFFLINE
        certification_status:
          type: string
          example: PENDING
          enum:
            - PENDING
            - APPROVED
            - REJECTED
        average_rating:
          type: string
          example: '4.5'
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateWorkerProfileRequest:
      type: object
      required:
        - full_name
        - category_id
        - hourly_rate
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 100
          example: Carlos García
          description: Nombre completo del trabajador
        avatar_url:
          type: string
          example: https://example.com/avatar.jpg
          description: URL del avatar (JPG/PNG)
          nullable: true
        bio:
          type: string
          maxLength: 500
          example: Técnico especialista en reparaciones
          description: Biografía del trabajador (máx. 500 caracteres)
          nullable: true
        category_id:
          type: string
          format: uuid
          example: b2c3d4e5-...
          description: ID de la categoría de servicio
        hourly_rate:
          type: number
          example: 35.5
          description: Tarifa por hora (valor positivo)
        availability_status:
          type: string
          example: AVAILABLE
          enum:
            - AVAILABLE
            - BUSY
            - OFFLINE
          description: Estado de disponibilidad (por defecto AVAILABLE)
    UpdateWorkerProfileRequest:
      type: object
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 100
          example: Carlos García
          description: Nombre completo del trabajador
        avatar_url:
          type: string
          example: https://example.com/avatar.jpg
          description: URL del avatar (JPG/PNG)
          nullable: true
        bio:
          type: string
          maxLength: 500
          example: Técnico especialista en reparaciones
          description: Biografía del trabajador (máx. 500 caracteres)
          nullable: true
        category_id:
          type: string
          format: uuid
          example: b2c3d4e5-...
          description: ID de la categoría de servicio
        hourly_rate:
          type: number
          example: 40
          description: Tarifa por hora (valor positivo)
        availability_status:
          type: string
          example: BUSY
          enum:
            - AVAILABLE
            - BUSY
            - OFFLINE
          description: Estado de disponibilidad
      description: Todos los campos son opcionales en PATCH
    CreateWorkerProfileResponse:
      type: object
      properties:
        message:
          type: string
          example: Perfil de trabajador creado correctamente
        profile:
          $ref: '#/components/schemas/WorkerProfileResponse'
    UpdateWorkerProfileResponse:
      type: object
      properties:
        message:
          type: string
          example: Perfil de trabajador actualizado correctamente
        profile:
          $ref: '#/components/schemas/WorkerProfileResponse'
    WorkerProfileExistsError:
      type: object
      properties:
        error:
          type: string
          example: WORKER_PROFILE_EXISTS
        message:
          type: string
          example: El perfil de trabajador ya existe. Usa PATCH para actualizarlo.
        statusCode:
          type: integer
          example: 409
        timestamp:
          type: string
          format: date-time
    WorkerProfileNotFoundError:
      type: object
      properties:
        error:
          type: string
          example: WORKER_PROFILE_NOT_FOUND
        message:
          type: string
          example: Perfil de trabajador no encontrado. Crea uno con POST.
        statusCode:
          type: integer
          example: 404
        timestamp:
          type: string
          format: date-time
    SwitchRoleRequest:
      type: object
      required:
        - role
      properties:
        role:
          type: string
          example: worker
          enum:
            - client
            - worker
          description: Rol al que se desea cambiar (client o worker)
    SwitchRoleResponse:
      type: object
      properties:
        new_role:
          type: string
          example: worker
          enum:
            - client
            - worker
          description: Rol activo después del cambio
        previous_role:
          type: string
          example: client
          enum:
            - client
            - worker
          nullable: true
          description: Rol anterior antes del cambio
        accessToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIs...
          description: Nuevo JWT con el rol actualizado. Expira en 1 hora.
        timestamp:
          type: string
          format: date-time
    SwitchRoleSameRoleError:
      type: object
      properties:
        error:
          type: string
          example: SAME_ROLE
        message:
          type: string
          example: El usuario ya tiene el rol worker
        statusCode:
          type: integer
          example: 409
        timestamp:
          type: string
          format: date-time
    SwitchRoleMissingProfileError:
      type: object
      properties:
        error:
          type: string
          example: MISSING_WORKER_PROFILE
        message:
          type: string
          example: Debes tener un perfil de trabajador para cambiar de rol
        statusCode:
          type: integer
          example: 409
        timestamp:
          type: string
          format: date-time
    SwitchRoleNotCertifiedError:
      type: object
      properties:
        error:
          type: string
          example: WORKER_NOT_CERTIFIED
        message:
          type: string
          example: Tu perfil de trabajador debe tener certificación aprobada para activar el rol
        statusCode:
          type: integer
          example: 403
        timestamp:
          type: string
          format: date-time
    UpdateProfileRequest:
      type: object
      required:
        - full_name
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 100
          example: Juan Pérez
          description: Nombre completo del usuario
        avatar_url:
          type: string
          example: https://example.com/avatar.jpg
          description: URL del avatar (JPG/PNG)
          nullable: true
        bio:
          type: string
          maxLength: 500
          example: Técnico especialista en reparaciones
          description: Biografía del usuario (máx. 500 caracteres)
          nullable: true
    UpdateProfileResponse:
      type: object
      properties:
        message:
          type: string
          example: Perfil actualizado correctamente
        profile:
          type: object
          properties:
            id:
              type: string
              format: uuid
            full_name:
              type: string
            avatar_url:
              type: string
              nullable: true
            bio:
              type: string
              nullable: true
            updated_at:
              type: string
              format: date-time
    NotFoundError:
      type: object
      properties:
        error:
          type: string
          example: USER_NOT_FOUND
        message:
          type: string
          example: Usuario no encontrado
        statusCode:
          type: integer
          example: 404
        timestamp:
          type: string
          format: date-time
    RegisterRequest:
      type: object
      required:
        - email
        - phone
        - password
      properties:
        email:
          type: string
          format: email
          example: usuario@example.com
        phone:
          type: string
          minLength: 8
          maxLength: 15
          example: '3001234567'
          description: Número de teléfono (8–15 dígitos)
        password:
          type: string
          format: password
          example: P@ssword123!
          description: 'Mínimo 8 caracteres, debe incluir: mayúscula, minúscula, número y símbolo'
    LoginRequest:
      type: object
      required:
        - password
      properties:
        email:
          type: string
          format: email
          example: usuario@example.com
          description: Requerido si no se proporciona phone
        phone:
          type: string
          example: '3001234567'
          description: Requerido si no se proporciona email
        password:
          type: string
          format: password
          example: P@ssword123!
    VerifyOtpRequest:
      type: object
      required:
        - otp_code
      properties:
        email:
          type: string
          format: email
          example: usuario@example.com
          description: Requerido si no se proporciona phone
        phone:
          type: string
          example: '3001234567'
          description: Requerido si no se proporciona email
        otp_code:
          type: string
          minLength: 6
          maxLength: 6
          example: '123456'
          description: Código OTP de 6 dígitos recibido por Email/SMS
    RefreshTokenRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
          description: Refresh token obtenido de /auth/verify-otp
    ForgotPasswordRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          example: usuario@example.com
        phone:
          type: string
          example: '3001234567'
      description: Debe proporcionarse al menos email o phone
    VerifyResetCodeRequest:
      type: object
      required:
        - reset_code
      properties:
        email:
          type: string
          format: email
          example: usuario@example.com
        phone:
          type: string
          example: '3001234567'
        reset_code:
          type: string
          minLength: 6
          maxLength: 6
          example: '123456'
          description: Código de recuperación de 6 dígitos
      description: Debe proporcionarse al menos email o phone junto con el código
    ResetPasswordRequest:
      type: object
      required:
        - token
        - password
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUz...
          description: Token temporal obtenido de /auth/verify-reset-code
        password:
          type: string
          format: password
          example: NewSecureP@ss1!
          description: Mínimo 8 caracteres, mayúscula, minúscula, número y símbolo
    TempTokenResponse:
      type: object
      properties:
        message:
          type: string
          example: Código verificado correctamente.
        token:
          type: string
          example: eyJhbGciOiJIUz...
          description: Token temporal de restablecimiento. Válido por 10 minutos.
    RegisterResponse:
      type: object
      properties:
        message:
          type: string
          example: Usuario registrado correctamente. Por favor verifica tu cuenta con el código OTP enviado.
        user:
          type: object
          properties:
            id:
              type: string
              format: uuid
              example: a1b2c3d4-...
            email:
              type: string
              example: usuario@example.com
            phone:
              type: string
              example: '3001234567'
    LoginPendingResponse:
      type: object
      properties:
        status:
          type: string
          example: PENDING_VERIFICATION
        message:
          type: string
          example: Código OTP enviado al correo/teléfono registrado.
        user:
          type: object
          properties:
            id:
              type: string
              format: uuid
            email:
              type: string
    AuthResponse:
      type: object
      properties:
        message:
          type: string
          example: Verificación exitosa
        accessToken:
          type: string
          example: eyJhbGciOiJIUz...
          description: JWT de acceso. Expira en 1 hora.
        refreshToken:
          type: string
          example: eyJhbGciOiJIUz...
          description: Token de refresco. Expira en 7 días.
        user:
          type: object
          properties:
            id:
              type: string
              format: uuid
            email:
              type: string
            phone:
              type: string
    RefreshTokenResponse:
      type: object
      properties:
        accessToken:
          type: string
          example: eyJhbGciOiJIUz...
        refreshToken:
          type: string
          example: eyJhbGciOiJIUz...
          description: Nuevo refresh token (el anterior queda revocado)
    ValidationError:
      type: object
      properties:
        error:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: La contraseña debe tener al menos 8 caracteres, incluir una mayúscula, una minúscula, un número y un símbolo
        statusCode:
          type: integer
          example: 400
        timestamp:
          type: string
          format: date-time
    UnauthorizedError:
      type: object
      properties:
        error:
          type: string
          example: AUTH_FAILED
        message:
          type: string
          example: Credenciales incorrectas
        statusCode:
          type: integer
          example: 401
        timestamp:
          type: string
          format: date-time
    InvalidOtpError:
      type: object
      properties:
        error:
          type: string
          example: INVALID_OTP
        message:
          type: string
          example: Código OTP inválido o expirado
        statusCode:
          type: integer
          example: 400
        timestamp:
          type: string
          format: date-time
    ConflictError:
      type: object
      properties:
        error:
          type: string
          example: CONFLICT_ERROR
        message:
          type: string
          example: El correo electrónico o teléfono ya están registrados
        statusCode:
          type: integer
          example: 409
        timestamp:
          type: string
          format: date-time
    InvalidRefreshTokenError:
      type: object
      properties:
        error:
          type: string
          example: INVALID_REFRESH_TOKEN
        message:
          type: string
          example: Token de refresco inválido, expirado o ya utilizado
        statusCode:
          type: integer
          example: 401
        timestamp:
          type: string
          format: date-time
    RateLimitError:
      type: object
      properties:
        error:
          type: string
          example: TOO_MANY_REQUESTS
        message:
          type: string
          example: Demasiados intentos de autenticación. Por favor, intente de nuevo en 15 minutos.
        statusCode:
          type: integer
          example: 429
        timestamp:
          type: string
          format: date-time
    ForbiddenError:
      type: object
      properties:
        error:
          type: string
          example: FORBIDDEN
        message:
          type: string
          example: No tiene permisos suficientes para acceder a este recurso
        statusCode:
          type: integer
          example: 403
        timestamp:
          type: string
          format: date-time
    LocationResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: a1b2c3d4-...
        user_id:
          type: string
          format: uuid
          example: a1b2c3d4-...
        address:
          type: string
          example: Calle Falsa 123, Bogotá
          description: Dirección formateada en texto plano
        latitude:
          type: number
          example: 4.711
        longitude:
          type: number
          example: -74.0721
        is_primary:
          type: boolean
          example: false
          description: Si es la ubicación principal del usuario
        distance_m:
          type: number
          example: 1240.5
          nullable: true
          description: Distancia en metros desde el punto de referencia (lat/lng). Solo en el listado cuando se provee lat/lng.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateLocationRequest:
      type: object
      required:
        - address
        - latitude
        - longitude
      properties:
        address:
          type: string
          minLength: 3
          maxLength: 255
          example: Calle Falsa 123, Bogotá
          description: Dirección formateada en texto plano
        latitude:
          type: number
          minimum: -90
          maximum: 90
          example: 4.711
          description: Latitud decimal dentro del rango [-90, 90]
        longitude:
          type: number
          minimum: -180
          maximum: 180
          example: -74.0721
          description: Longitud decimal dentro del rango [-180, 180]
        is_primary:
          type: boolean
          example: false
          description: Marcar como ubicación principal (por defecto la primera lo es)
    UpdateLocationRequest:
      type: object
      properties:
        address:
          type: string
          minLength: 3
          maxLength: 255
          example: Calle Nueva 456, Bogotá
          description: Nueva dirección
        latitude:
          type: number
          minimum: -90
          maximum: 90
          example: 4.7
        longitude:
          type: number
          minimum: -180
