name: CI + CD

on:
  push:
    branches: [Arreglar_Cosas_2, develop, main]
  pull_request:
    branches: [main, develop, Arreglar_Cosas_2]

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Check Code Format
        run: npm run format:check

      - name: Run Tests
        run: |
          export JWT_RESET_SECRET="${JWT_RESET_SECRET:-$(openssl rand -hex 32)}"
          npm test

      - name: Publish coverage summary
        run: |
          node --input-type=module -e '
          import fs from "node:fs";
          const total = JSON.parse(fs.readFileSync("coverage/coverage-summary.json", "utf8")).total;
          const row = (label, key) => `| ${label} | ${total[key].pct}% |`;
          const table = [
            "## Cobertura",
            "",
            "| Métrica | Cobertura |",
            "|---|---:|",
            row("Statements", "statements"),
            row("Branches", "branches"),
            row("Functions", "functions"),
            row("Lines", "lines"),
            "",
          ].join("\n");
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, table);
          '

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: error

  deploy:
    needs: test-and-lint
    if: github.event_name == 'push' && (github.ref == 'refs/heads/Arreglar_Cosas_2' || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    runs-on: [self-hosted, laborin-deploy]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Sync and rebuild API
        run: |
          set -euo pipefail
          cp -a src/. /home/Startup/deploy/backend/src/
          cp knexfile.js package.json package-lock.json Dockerfile .env.example /home/Startup/deploy/backend/
          docker compose --env-file /home/Startup/deploy/backend.env -p laborin-backend -f /home/Startup/deploy/backend/docker-compose.local.yml up -d --build api
          docker exec laborin_api ./node_modules/.bin/knex migrate:latest --knexfile knexfile.js
          for i in $(seq 1 30); do
            if docker exec laborin_api wget -q --spider http://127.0.0.1:3000/api/v1/health; then
              break
            fi
            sleep 2
          done
          docker exec laborin_api wget -q --spider http://127.0.0.1:3000/api/v1/health
