name: Continuous Integration

on:
  pull_request:
    branches:
      - main
      - '*'

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Check Code Format
        run: npm run format:check

      - name: Run Tests
        run: npm test
