version: '3.8'

services:
  db:
    image: postgis/postgis:14-3.4-alpine
    container_name: ondemand_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD requerido en .env}
      POSTGRES_DB: ondemand_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ondemand_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: ondemand_api
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=${NODE_ENV:-development}
      # Se interpola desde el `.env` del proyecto (Compose lo lee automáticamente),
      # con fallback equivalente a la variable de ejemplo. Hace falta incluir el
      # origen de Metro (http://localhost:8081) para probar con Expo Web: React
      # Native no manda header Origin, pero el navegador sí.
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8081}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-}
      # El servidor no arranca sin estas claves; Compose falla antes si faltan en .env
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET requerido en .env}
      - REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET:?REFRESH_TOKEN_SECRET requerido en .env}
      - JWT_RESET_SECRET=${JWT_RESET_SECRET:?JWT_RESET_SECRET requerido en .env}
      - JWT_ISSUER=${JWT_ISSUER:-ondemand-api}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-ondemand-client}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?ENCRYPTION_KEY requerido en .env}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD requerido en .env}
      - DB_NAME=${DB_NAME:-ondemand_db}
      - DB_SSL=${DB_SSL:-false}
      - DB_SSL_REJECT_UNAUTHORIZED=${DB_SSL_REJECT_UNAUTHORIZED:-true}
      - REDIS_URL=redis://redis:6379
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: ondemand_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
